name: build

on:
  schedule:
    - cron: "17 6 1 * *"   # monthly, 1st of the month
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "test_build.py", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
      - run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit header if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/header-*.svg
          git diff --cached --quiet || git commit -m "chore: redraw profile header"
          git push
